<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login — बगीचा ब्लॉक पोर्टल">
  <title>Login | बगीचा ब्लॉक पोर्टल</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/auth-style.css">
</head>
<body class="auth-page">

<header class="top">
  <div class="top-inner">
    <div class="brand"><img src="../../images/logo.svg" alt="बगीचा ब्लॉक" class="brand-mark" width="34" height="34"> बगीचा ब्लॉक पोर्टल</div>
    <a class="simple-home" href="../../index.html" aria-label="होम पर वापस जाएँ">← होम</a>
  </div>
</header>

<main class="auth-main">
  <section class="auth-card">
    <span class="eyebrow">स्वागत है</span>
    <h1>Login करें</h1>
    <p>बगीचा ब्लॉक पोर्टल में अपने खाते से जुड़ें।</p>

    <form class="auth-form" id="loginForm" novalidate>
      <div>
        <label for="loginEmail">ईमेल</label>
        <input id="loginEmail" name="email" type="email" required placeholder="apnapnaam@example.com" autocomplete="email">
      </div>

      <div>
        <label for="loginPassword">पासवर्ड</label>
        <input id="loginPassword" name="password" type="password" required placeholder="अपना पासवर्ड" autocomplete="current-password">
      </div>

      <div class="auth-error" id="authError" role="alert"></div>

      <button class="btn btn-primary" type="submit">Login करें</button>
    </form>

    <p class="auth-switch">
      अभी खाता नहीं है?
      <a href="signup.html">Sign Up करें</a>
    </p>

    <p class="auth-note">
      अभी login device के browser ke localStorage me save hota hai.
      Official server-based account system बाद में जोड़ा जा सकता है।
    </p>
  </section>
</main>

<footer>
  <strong>बगीचा ब्लॉक पोर्टल</strong>
  <div class="site-footer-links" aria-label="सहायता और जानकारी">
    <a href="../../index.html">Home</a>
    <a href="../about.html">About</a>
    <a href="../contact.html">Contact</a>
    <a href="../feedback.html">Feedback</a>
  </div>
</footer>

<script src="../../js/paths.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/auth-pages.js"></script>
</body>
</html>
