<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign Up — बगीचा ब्लॉक पोर्टल">
  <title>Sign Up | बगीचा ब्लॉक पोर्टल</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/auth-style.css">
</head>
<body class="auth-page">

<header class="top">
  <div class="top-inner">
    <div class="brand"><img src="../../images/logo.svg" alt="बगीचा ब्लॉक" class="brand-mark" width="34" height="34"> बगीचा ब्लॉक पोर्टल</div>
    <a class="simple-home" href="../../index.html" aria-label="होम पर वापस जाएँ">← होम</a>
  </div>
</header>

<main class="auth-main">
  <section class="auth-card">
    <span class="eyebrow">नया खाता</span>
    <h1>Sign Up करें</h1>
    <p>बगीचा ब्लॉक पोर्टल में नया खाता बनाएं।</p>

    <form class="auth-form" id="signupForm" novalidate>
      <div>
        <label for="signupName">पूरा नाम</label>
        <input id="signupName" name="name" type="text" required maxlength="80" placeholder="अपना नाम">
      </div>

      <div>
        <label for="signupEmail">ईमेल</label>
        <input id="signupEmail" name="email" type="email" required placeholder="apnapnaam@example.com" autocomplete="email">
      </div>

      <div>
        <label for="signupPassword">पासवर्ड</label>
        <input id="signupPassword" name="password" type="password" required minlength="4" placeholder="कम से कम 4 अक्षर" autocomplete="new-password">
      </div>

      <div>
        <label for="signupPassword2">पासवर्ड दोबारा</label>
        <input id="signupPassword2" name="password2" type="password" required minlength="4" placeholder="पासवर्ड फिर लिखें" autocomplete="new-password">
      </div>

      <div class="auth-error" id="signupError" role="alert"></div>

      <button class="btn btn-primary" type="submit">खाता बनाएं</button>
    </form>

    <p class="auth-switch">
      पहले से खाता है?
      <a href="login.html">Login करें</a>
    </p>

    <p class="auth-note">
      Sign up के बाद आप automatic login ho jayenge। अभी account is device ke browser के localStorage me save hota hai।
    </p>
  </section>
</main>

<footer>
  <strong>बगीचा ब्लॉक पोर्टल</strong>
  <div class="site-footer-links" aria-label="सहायता और जानकारी">
    <a href="../../index.html">Home</a>
    <a href="../about.html">About</a>
    <a href="../contact.html">Contact</a>
    <a href="../feedback.html">Feedback</a>
  </div>
</footer>

<script src="../../js/paths.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/auth-pages.js"></script>
</body>
</html>
