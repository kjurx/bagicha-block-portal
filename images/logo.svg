<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2a233"/>
      <stop offset="100%" stop-color="#a8442b"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c8a5a"/>
      <stop offset="100%" stop-color="#3d6b3a"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="1" y="1" width="46" height="46" rx="10" fill="url(#bg)"/>
  <!-- Leaf accent top-right -->
  <path d="M36 6 C40 6, 44 10, 42 16 C40 12, 36 10, 36 6Z" fill="url(#leaf)" opacity="0.85"/>
  <path d="M38 5 C42 4, 46 8, 43 14" fill="none" stroke="#3d6b3a" stroke-width="1" opacity="0.5"/>
  <!-- Hindi letter ब -->
  <text x="24" y="33" text-anchor="middle" font-family="'Baloo 2','Baloo',sans-serif" font-weight="800" font-size="28" fill="#f6f0e1">ब</text>
  <!-- Small leaf bottom-left -->
  <path d="M8 42 C6 38, 6 34, 10 32 C8 36, 8 38, 8 42Z" fill="url(#leaf)" opacity="0.6"/>
</svg>
